<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>きょうの献立、おまかせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EE;--paper:#FFFDF9;--paper2:#FFF8EE;
    --terra:#DD6B4D;--terra-deep:#C5512F;--terra-soft:#FBE6DD;
    --herb:#6E9155;--herb-soft:#E7EFDD;
    --gold:#E8A33D;--gold-soft:#FFF3D6;
    --ink:#3B352E;--muted:#928879;--line:#ECE2D3;
    --shadow:0 10px 30px -12px rgba(110,80,50,.22);
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Maru Gothic',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 400px at 100% -10%,#FCEFE2 0%,transparent 55%),
      radial-gradient(900px 380px at -10% 8%,#EEF3E5 0%,transparent 50%),
      var(--cream);
    background-attachment:fixed;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding:0 0 64px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px;}
  header{padding:34px 0 14px;text-align:center;}
  .kicker{font-size:12px;letter-spacing:.22em;color:var(--herb);font-weight:700;margin-bottom:6px;}
  h1{font-family:'Yomogi',cursive;font-size:31px;line-height:1.35;margin:0;font-weight:400;color:var(--terra-deep);}
  h1 .pot{display:inline-block;transform:translateY(3px);}
  .sub{font-size:13.5px;color:var(--muted);margin-top:8px;}

  /* mode toggle */
  .mode-toggle{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-top:18px;}
  .mode-btn{
    flex:1;text-align:center;padding:11px 8px;border-radius:11px;
    font-size:14px;font-weight:700;cursor:pointer;transition:.2s;border:none;
    font-family:inherit;color:var(--muted);background:transparent;
  }
  .mode-btn.active{background:var(--paper);color:var(--terra-deep);box-shadow:0 2px 8px rgba(0,0,0,.08);}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;margin-top:18px;}
  .field{margin-bottom:20px;}.field:last-child{margin-bottom:0;}
  label.flabel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:9px;}
  .flabel .dot{width:9px;height:9px;border-radius:50%;background:var(--terra);box-shadow:0 0 0 4px var(--terra-soft);flex:none;}
  .hint{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:auto;}
  select,textarea,input[type=text]{
    width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    background:var(--paper2);border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  select:focus,textarea:focus,input:focus{border-color:var(--terra);box-shadow:0 0 0 3px var(--terra-soft);}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23C5512F' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px;}
  .chipbox{display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--paper2);border:1.5px solid var(--line);border-radius:13px;padding:9px 11px;min-height:48px;transition:border-color .15s,box-shadow .15s;}
  .chipbox.focus{border-color:var(--terra);box-shadow:0 0 0 3px var(--terra-soft);}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--herb-soft);color:#46612f;border-radius:999px;padding:5px 6px 5px 12px;font-size:13.5px;font-weight:500;animation:pop .18s ease;}
  .chip.al{background:var(--terra-soft);color:var(--terra-deep);}
  .chip b{font-weight:500;}
  .chip .x{width:18px;height:18px;border-radius:50%;border:none;cursor:pointer;background:rgba(0,0,0,.08);color:inherit;font-size:13px;line-height:1;display:grid;place-items:center;padding:0;}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .chipbox input{flex:1;min-width:90px;border:none;background:transparent;outline:none;font-family:inherit;font-size:15px;padding:5px 2px;}
  .steppers{display:flex;gap:12px;}
  .stepper{flex:1;background:var(--paper2);border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;}
  .stepper .t{font-size:12px;color:var(--muted);font-weight:500;}
  .stepper .row{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
  .stepper button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:20px;color:var(--terra-deep);cursor:pointer;line-height:1;font-weight:700;}
  .stepper button:active{transform:scale(.92);}
  .stepper .n{font-size:20px;font-weight:700;min-width:24px;text-align:center;}
  .timegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .timegrid .opt{border:1.5px solid var(--line);background:var(--paper2);border-radius:12px;padding:11px 4px;text-align:center;cursor:pointer;font-size:13.5px;font-weight:700;transition:.15s;}
  .timegrid .opt.sel{border-color:var(--terra);background:var(--terra);color:#fff;box-shadow:0 6px 14px -6px var(--terra-deep);}
  .go{width:100%;margin-top:6px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--terra) 0%,var(--terra-deep) 100%);color:#fff;font-family:inherit;font-weight:700;font-size:17px;padding:16px;border-radius:15px;letter-spacing:.04em;box-shadow:0 12px 24px -10px var(--terra-deep);transition:transform .1s,filter .15s;}
  .go:active{transform:translateY(1px) scale(.995);}
  .go:disabled{filter:grayscale(.4) opacity(.7);cursor:wait;}
  .loading{text-align:center;padding:30px 0 6px;display:none;}
  .loading.on{display:block;}
  .pot-anim{font-size:46px;display:inline-block;animation:bob 1.1s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
  .steam{height:18px;}
  .steam span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 4px;animation:steam 1.2s infinite;}
  .steam span:nth-child(2){animation-delay:.2s}.steam span:nth-child(3){animation-delay:.4s}
  @keyframes steam{0%{opacity:.2;transform:translateY(0)}50%{opacity:.9;transform:translateY(-6px)}100%{opacity:.2;transform:translateY(0)}}
  .loadtxt{color:var(--muted);font-size:14px;margin-top:6px;}
  #out{margin-top:8px;}
  .reveal{animation:rise .5s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .menuhead{text-align:center;padding:6px 4px 2px;}
  .menuhead .mt{font-family:'Yomogi',cursive;font-size:24px;color:var(--terra-deep);}
  .menuhead .ms{font-size:13.5px;color:var(--muted);margin-top:4px;}
  .nav{display:flex;gap:8px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap;}
  .nav a{text-decoration:none;font-size:12.5px;font-weight:700;color:var(--terra-deep);background:var(--terra-soft);padding:7px 13px;border-radius:999px;}
  .sec-t{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;margin:24px 4px 2px;}
  .sec-t .ic{font-size:20px;}
  .dish{margin-top:14px;}
  .dish .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px;}
  .dish .dn{font-weight:700;font-size:16.5px;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .badge.role{background:var(--herb-soft);color:#46612f;}
  .badge.time{background:var(--terra-soft);color:var(--terra-deep);}
  .ing{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .ing .it{font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--paper2);border:1px solid var(--line);}
  .ing .it.buy{border-style:dashed;border-color:var(--terra);color:var(--terra-deep);}
  .ing .it.buy::before{content:"＋ ";font-weight:700;}
  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;}
  ol.steps li{position:relative;padding:4px 0 12px 38px;counter-increment:s;font-size:14.5px;}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;}
  ol.steps li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:30px;bottom:2px;width:1.5px;background:var(--terra-soft);}
  .kids{margin-top:6px;background:linear-gradient(135deg,#FFF6E6,#FDEFD8);border:1px solid #F2DCAE;border-radius:14px;padding:12px 14px;font-size:13.5px;color:#7a5a1c;}
  .kids b{display:flex;align-items:center;gap:6px;color:#9a6a10;margin-bottom:3px;font-size:13px;}
  .shop{list-style:none;margin:0;padding:0;}
  .shop li{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);}
  .shop li:last-child{border-bottom:none;}
  .ck{width:23px;height:23px;border-radius:7px;border:2px solid var(--terra);flex:none;cursor:pointer;transition:.15s;display:grid;place-items:center;}
  .ck.on{background:var(--terra);}
  .ck.on::after{content:"✓";color:#fff;font-size:14px;font-weight:700;}
  .shop .nm{font-weight:500;font-size:15px;}
  .shop li.done .nm{text-decoration:line-through;color:var(--muted);}
  .shop .am{margin-left:auto;font-size:13px;color:var(--muted);}
  .shop .used{font-size:11px;color:var(--herb);margin-left:4px;}
  .divider{border:none;border-top:1px dashed var(--line);margin:16px 0;}
  .err{background:var(--terra-soft);color:var(--terra-deep);border-radius:13px;padding:14px;font-size:14px;text-align:center;}

  /* week cards */
  .week-summary{text-align:center;font-size:13.5px;color:var(--muted);margin:8px 0 4px;padding:0 8px;}
  .day-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;transition:.15s;}
  .day-card .day-head{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .day-card .day-num{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--terra),var(--terra-deep));color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;flex:none;}
  .day-card .day-dishes{flex:1;}
  .day-card .day-dishes .dd-name{font-weight:700;font-size:14.5px;}
  .day-card .day-dishes .dd-sub{font-size:12px;color:var(--muted);}
  .day-card .arrow{color:var(--muted);font-size:18px;transition:transform .2s;flex:none;}
  .day-card.open .arrow{transform:rotate(180deg);}
  .day-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .day-card.open .day-detail{display:block;}
  .day-loading{text-align:center;padding:16px 0;color:var(--muted);font-size:13px;}
  .day-loading .mini-spin{display:inline-block;animation:bob .9s ease-in-out infinite;font-size:24px;}

  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:30px;line-height:1.6;}

  /* history button */
  .hist-open{
    width:100%;margin-top:10px;border:1.5px solid var(--line);cursor:pointer;
    background:var(--paper);color:var(--terra-deep);font-family:inherit;font-weight:700;
    font-size:14px;padding:11px;border-radius:13px;transition:.15s;
  }
  .hist-open:active{transform:scale(.99);}
  #histCount{color:var(--muted);font-weight:500;font-size:13px;}

  /* history modal */
  .hist-modal{position:fixed;inset:0;background:rgba(59,53,46,.45);display:none;z-index:50;align-items:flex-end;justify-content:center;}
  .hist-modal.on{display:flex;animation:fade .2s;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .hist-sheet{background:var(--cream);width:100%;max-width:560px;max-height:85vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:slideup .28s cubic-bezier(.2,.7,.3,1);}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .hist-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--line);}
  .hist-h-title{font-weight:700;font-size:17px;}
  .hist-close{width:34px;height:34px;border-radius:50%;border:none;background:var(--line);color:var(--ink);font-size:20px;cursor:pointer;line-height:1;}
  .hist-list{overflow-y:auto;padding:12px 16px;flex:1;}
  .hist-item{display:flex;gap:10px;align-items:stretch;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .hist-main{flex:1;cursor:pointer;min-width:0;}
  .hist-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .hist-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .hist-tag.daily{background:var(--terra-soft);color:var(--terra-deep);}
  .hist-tag.weekly{background:var(--herb-soft);color:#46612f;}
  .hist-date{font-size:11.5px;color:var(--muted);}
  .hist-title{font-weight:700;font-size:15px;margin-bottom:2px;}
  .hist-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-del{border:none;background:transparent;font-size:18px;cursor:pointer;padding:0 4px;align-self:center;opacity:.6;}
  .hist-del:active{opacity:1;}
  .hist-clear{margin:8px 16px 20px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">忙しい毎日に、ひと息</div>
    <h1>きょうの献立、<br><span class="pot">🍲</span> おまかせ</h1>
    <div class="sub">冷蔵庫にあるもので、お子さんに合わせた一食を。</div>
  </header>

  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="daily">🍽 今日の1食</button>
    <button class="mode-btn" data-mode="weekly">📅 1週間おまかせ</button>
  </div>

  <button class="hist-open" id="histOpen" onclick="openHistory()">📖 これまでの献立 <span id="histCount"></span></button>

  <div class="card" id="form">
    <div class="field">
      <label class="flabel"><span class="dot"></span>いちばん小さいお子さんの月齢・年齢</label>
      <select id="age">
        <option value="離乳初期(生後5〜6ヶ月・ゴックン期/10倍がゆ・なめらかにすりつぶす)">離乳食 初期（5〜6ヶ月）</option>
        <option value="離乳中期(生後7〜8ヶ月・モグモグ期/舌でつぶせる固さ・粗くすりつぶす)">離乳食 中期（7〜8ヶ月）</option>
        <option value="離乳後期(生後9〜11ヶ月・カミカミ期/歯ぐきでつぶせる固さ・5〜8mm角)">離乳食 後期（9〜11ヶ月）</option>
        <option value="離乳完了期(1歳〜1歳半・パクパク期/手づかみ・薄味・1cm角)">離乳食 完了期（1〜1歳半）</option>
        <option value="幼児食前期(1歳半〜2歳/大人の半量・薄味・小さくやわらかく)">幼児食（1歳半〜2歳）</option>
        <option value="幼児食後期(3〜5歳/大人の半〜2/3量・薄味)" selected>幼児食（3〜5歳）</option>
        <option value="学童(6歳以上/大人とほぼ同じ・濃すぎない味付け)">学童（6歳〜）</option>
        <option value="大人のみ(子供なし)">大人のみ</option>
      </select>
    </div>
    <div class="field">
      <label class="flabel"><span class="dot"></span>冷蔵庫にある食材<span class="hint">入力して Enter</span></label>
      <div class="chipbox" id="foodbox"><input id="foodinput" type="text" inputmode="text" placeholder="例：鶏もも肉、にんじん、卵…"></div>
    </div>
    <div class="field">
      <label class="flabel"><span class="dot"></span>調理にかけられる時間<span class="hint" id="timeHint">（1食あたり）</span></label>
      <div class="timegrid" id="timegrid">
        <div class="opt" data-v="10分以内">10分</div>
        <div class="opt sel" data-v="20分以内">20分</div>
        <div class="opt" data-v="30分以内">30分</div>
        <div class="opt" data-v="40分以上じっくりOK">じっくり</div>
      </div>
    </div>
    <div class="field">
      <label class="flabel"><span class="dot"></span>家族の人数</label>
      <div class="steppers">
        <div class="stepper"><div class="t">大人</div><div class="row"><button data-t="adult" data-d="-1">−</button><span class="n" id="adult">2</span><button data-t="adult" data-d="1">＋</button></div></div>
        <div class="stepper"><div class="t">子ども</div><div class="row"><button data-t="kid" data-d="-1">−</button><span class="n" id="kid">1</span><button data-t="kid" data-d="1">＋</button></div></div>
      </div>
    </div>
    <div class="field">
      <label class="flabel"><span class="dot" style="background:var(--terra);box-shadow:0 0 0 4px var(--terra-soft)"></span>アレルギー・苦手な食材<span class="hint">あれば</span></label>
      <div class="chipbox" id="albox"><input id="alinput" type="text" placeholder="例：卵、えび、ピーマン…"></div>
    </div>
    <button class="go" id="go">献立をつくる ✨</button>
  </div>

  <div class="loading" id="loading">
    <div class="pot-anim">🍳</div>
    <div class="steam"><span></span><span></span><span></span></div>
    <div class="loadtxt" id="loadtxt">冷蔵庫をのぞいています…</div>
  </div>
  <div id="out"></div>
  <footer>献立はAIの提案です。アレルギー・体調に合わせて最終判断はご家庭で。<br>はじめての食材・離乳食は少量から様子を見てあげてください。</footer>
</div>

<div class="hist-modal" id="histModal">
  <div class="hist-sheet">
    <div class="hist-header">
      <div class="hist-h-title">📖 これまでの献立</div>
      <button class="hist-close" onclick="closeHistory()" aria-label="閉じる">×</button>
    </div>
    <div class="hist-list" id="histList"></div>
    <button class="hist-clear" onclick="clearHistory()">すべての履歴を削除</button>
  </div>
</div>

<script>
const PROXY_URL = "https://sedori-proxy.kawauso-movie124.workers.dev";
const MODEL = "claude-sonnet-4-6";

const foods = [], allergies = [];
const count = { adult:2, kid:1 };
let cookTime = "20分以内";
let mode = "daily";
let weekData = null;  // 週間プラン保持

/* ---- chips ---- */
function setupChips(boxId, inputId, arr, cls){
  const box=document.getElementById(boxId), input=document.getElementById(inputId);
  function render(){
    box.querySelectorAll('.chip').forEach(c=>c.remove());
    arr.forEach((v,i)=>{
      const chip=document.createElement('span'); chip.className='chip'+(cls?' '+cls:'');
      chip.innerHTML=`<b></b><button class="x" aria-label="削除">×</button>`;
      chip.querySelector('b').textContent=v;
      chip.querySelector('.x').onclick=()=>{arr.splice(i,1);render();};
      box.insertBefore(chip,input);
    });
  }
  function add(){
    const parts=input.value.split(/[,、\n]/).map(s=>s.trim()).filter(Boolean);
    parts.forEach(p=>{if(!arr.includes(p))arr.push(p);});
    input.value='';render();
  }
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add();}else if(e.key==='Backspace'&&input.value===''&&arr.length){arr.pop();render();}});
  input.addEventListener('blur',add);
  box.addEventListener('click',()=>input.focus());
  input.addEventListener('focus',()=>box.classList.add('focus'));
  input.addEventListener('blur',()=>box.classList.remove('focus'));
}
setupChips('foodbox','foodinput',foods,'');
setupChips('albox','alinput',allergies,'al');

/* ---- steppers ---- */
document.querySelectorAll('.stepper button').forEach(b=>{
  b.onclick=()=>{const t=b.dataset.t,d=+b.dataset.d;count[t]=Math.max(t==='adult'?1:0,count[t]+d);document.getElementById(t).textContent=count[t];};
});

/* ---- time ---- */
document.querySelectorAll('#timegrid .opt').forEach(o=>{
  o.onclick=()=>{document.querySelectorAll('#timegrid .opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');cookTime=o.dataset.v;};
});

/* ---- mode toggle ---- */
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    mode=btn.dataset.mode;

/* ---- API call helper ---- */
async function callAPI(sys, user, maxTok){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),90000);
  try{
    const res=await fetch(PROXY_URL,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:MODEL,max_tokens:maxTok||4096,system:sys,messages:[{role:"user",content:user}]}),
      signal:ctrl.signal
    });
    clearTimeout(timer);
    if(!res.ok){let d="";try{const e=await res.json();d=e.error?.message||e.error||"";}catch(_){}throw new Error("proxy "+res.status+(d?"："+d:""));}
    const data=await res.json();
    if(data.error) throw new Error("API: "+(data.error.message||JSON.stringify(data.error)));
    let text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    if(!text.trim()) throw new Error("空の応答");
    text=text.replace(/```json|```/g,"").trim();
    const s=text.indexOf("{");if(s>=0)text=text.slice(s);
    return {json:parseLoose(text), raw:text, stop:data.stop_reason};
  }finally{clearTimeout(timer);}
}

/* ---- JSON repair ---- */
function balance(t){
  let inStr=false,escp=false;const stack=[];
  for(let i=0;i<t.length;i++){const c=t[i];if(inStr){if(escp)escp=false;else if(c==='\\')escp=true;else if(c==='"')inStr=false;continue;}if(c==='"')inStr=true;else if(c==='{'||c==='[')stack.push(c);else if(c==='}'||c===']')stack.pop();}
  let out=t;if(inStr)out+='"';out=out.replace(/[,:]\s*$/,'');
  for(let i=stack.length-1;i>=0;i--)out+=stack[i]==='{'?'}':']';return out;
}
function parseLoose(t){
  try{return JSON.parse(t);}catch(e){}
  for(let cut=t.length;cut>20;cut--){const ch=t[cut-1];if(ch!==','&&ch!=='}'&&ch!==']'&&ch!=='"')continue;try{return JSON.parse(balance(t.slice(0,cut)));}catch(e){}}
  return null;
}

const sysDaily=`あなたは子育て家庭に寄り添う管理栄養士です。家庭にある食材で、忙しい親が作れる現実的な一食（主菜＋副菜＋汁物などの組み合わせ）を提案します。
厳守事項：
- アレルギー・苦手食材は料理にも調味料にも一切使わない。

async function generateDaily(){

    html+=`<div class="dish"><div class="top"><span class="dn">${esc(d.name)}</span>${d.role?`<span class="badge role">${esc(d.role)}</span>`:''}${d.time?`<span class="badge time">⏱ ${esc(d.time)}</span>`:''}</div>${ing?`<div class="ing">${ing}</div>`:''}<ol class="steps">${steps}</ol>${d.forKids?`<div class="kids"><b>👶 取り分け・お子さんポイント</b>${esc(d.forKids)}</div>`:''}</div><hr class="divider">`;

/* ---- day detail (step 2) ---- */
const dayDetailCache={};

window.toggleDay=async function(i){
  const card=document.querySelector(`.day-card[data-day-index="${i}"]`);
  if(card.classList.contains('open')){card.classList.remove('open');return;}
  card.classList.add('open');
  if(dayDetailCache[i]){return;}
  const loadEl=document.getElementById(`day-loading-${i}`);
  const recipeEl=document.getElementById(`day-recipes-${i}`);
  loadEl.style.display='block';recipeEl.innerHTML='';

  const dayInfo=weekData.days[i];
  const sysDayDetail=`あなたは子育て家庭に寄り添う管理栄養士です。指定された献立の詳細レシピを作ります。
厳守事項：
- アレルギー・苦手食材は一切使わない。
- お子さんの月齢・年齢に応じた取り分けのコツを forKids に書く（大人のみなら空文字）。
- 手順は各3〜6ステップで簡潔に。
- 出力は日本語。`;
  const userDay=getInputText()+`\n\n${dayInfo.day}曜日の献立：${(dayInfo.dishes||[]).map(d=>d.name+'('+d.role+')').join('、')}\n\nこの献立の詳細レシピを次のJSONのみで返答：
{"dishes":[{"name":"料理名","role":"主菜/副菜/汁物","time":"目安","ingredients":[{"name":"食材","amount":"分量"}],"steps":["手順"],"forKids":"取り分けのコツ"}]}`;

  try{
    const r=await callAPI(sysDayDetail,userDay,3072);
    loadEl.style.display='none';
    if(!r.json||!r.json.dishes?.length){recipeEl.innerHTML='<div class="err">レシピを読み取れませんでした。もう一度タップしてみてください。</div>';return;}
    dayDetailCache[i]=r.json;
    let h='';
    (r.json.dishes||[]).forEach(d=>{
      const ing=(d.ingredients||[]).map(ig=>`<span class="it">${esc(ig.name)}${ig.amount?' '+esc(ig.amount):''}</span>`).join('');
      const steps=(d.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('');
      h+=`<div class="dish"><div class="top"><span class="dn">${esc(d.name)}</span>${d.role?`<span class="badge role">${esc(d.role)}</span>`:''}${d.time?`<span class="badge time">⏱ ${esc(d.time)}</span>`:''}</div>${ing?`<div class="ing">${ing}</div>`:''}<ol class="steps">${steps}</ol>${d.forKids?`<div class="kids"><b>👶 取り分け・お子さんポイント</b>${esc(d.forKids)}</div>`:''}</div><hr class="divider">`;
    });
    recipeEl.innerHTML=h;
  }catch(err){
    loadEl.style.display='none';
    recipeEl.innerHTML=`<div class="err">レシピ取得に失敗しました<br><span style="font-size:11px">(${esc(err.message)})</span></div>`;
    card.classList.remove('open');
  }
};

/* ============ HISTORY (localStorage) ============ */
const HIST_KEY='kondate_history_v1';
function loadHistory(){
  try{return JSON.parse(localStorage.getItem(HIST_KEY))||[];}catch(e){return [];}
}
function saveHistory(type,data){
  try{
    const list=loadHistory();
    let title,sub;
    if(type==='daily'){
      title=data.menuTitle||'献立';
      sub=(data.dishes||[]).map(d=>d.name).join('・');
    }else{
      title='1週間の献立';
      sub=data.weekSummary||'';
    }
    list.unshift({id:Date.now(),type,title,sub,data,savedAt:new Date().toISOString()});
    if(list.length>50) list.length=50; // 上限50件
    localStorage.setItem(HIST_KEY,JSON.stringify(list));
    updateHistoryBadge();
  }catch(e){console.warn('history save failed',e);}
}
function deleteHistory(id){
  const list=loadHistory().filter(h=>h.id!==id);
  localStorage.setItem(HIST_KEY,JSON.stringify(list));
  renderHistoryList();
  updateHistoryBadge();
}
function clearHistory(){
  if(!confirm('履歴をすべて削除しますか？')) return;
  localStorage.removeItem(HIST_KEY);
  renderHistoryList();
  updateHistoryBadge();
}
function fmtDate(iso){
  const d=new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function updateHistoryBadge(){
  const n=loadHistory().length;
  const b=document.getElementById('histCount');
  if(b) b.textContent=n?`(${n})`:'';
}

function openHistory(){
  document.getElementById('histModal').classList.add('on');
  renderHistoryList();
}
function closeHistory(){
  document.getElementById('histModal').classList.remove('on');
}
function renderHistoryList(){
  const list=loadHistory();
  const el=document.getElementById('histList');
  if(!list.length){
    el.innerHTML='<p style="text-align:center;color:var(--muted);padding:30px 0;font-size:14px">まだ履歴がありません。<br>献立をつくると、ここに残ります📝</p>';
    return;
  }
  el.innerHTML=list.map(h=>`
    <div class="hist-item">
      <div class="hist-main" onclick="viewHistory(${h.id})">
        <div class="hist-top">
          <span class="hist-tag ${h.type}">${h.type==='weekly'?'📅 1週間':'🍽 1食'}</span>
          <span class="hist-date">${fmtDate(h.savedAt)}</span>
        </div>
        <div class="hist-title">${esc(h.title)}</div>
        <div class="hist-sub">${esc(h.sub||'')}</div>
      </div>
      <button class="hist-del" onclick="deleteHistory(${h.id})" aria-label="削除">🗑</button>
    </div>`).join('');
}
window.viewHistory=function(id){
  const h=loadHistory().find(x=>x.id===id);
  if(!h) return;
  closeHistory();
  if(h.type==='weekly'){
    weekData=h.data;
    Object.keys(dayDetailCache).forEach(k=>delete dayDetailCache[k]);
    renderWeekly(h.data);
  }else{
    renderDaily(h.data);
  }
};
window.deleteHistory=deleteHistory;


const loading=document.getElementById('loading');
const out=document.getElementById('out');

go.onclick=async()=>{
  if(foods.length===0){out.innerHTML='<div class="card err">冷蔵庫にある食材を1つ以上入れてくださいね🥕</div>';return;}
  go.disabled=true;out.innerHTML='';loading.classList.add('on');
  weekData=null;Object.keys(dayDetailCache).forEach(k=>delete dayDetailCache[k]);
  startLoad(mode==='weekly'?loadMsgsWeekly:loadMsgsDaily);
  try{
    if(mode==='weekly') await generateWeekly();
    else await generateDaily();
  }catch(err){
    let msg=err.message||String(err);
    if(err.name==='AbortError')msg="時間がかかりすぎました（タイムアウト）";
    else if(/Failed to fetch|NetworkError/i.test(msg))msg="proxyに接続できませんでした";
    out.innerHTML=`<div class="card err">うまく作れませんでした…<br><span style="font-size:12px;opacity:.85">${esc(msg)}</span></div>`;
  }finally{
    stopLoad();loading.classList.remove('on');go.disabled=false;
  }
};

updateHistoryBadge();
